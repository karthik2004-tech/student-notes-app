<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tic-Tac-Toe with AI Opponent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <h1>❌⭕ Tic-Tac-Toe</h1>

    <div class="mode-select">
      <button onclick="setMode('pvp')">👥 Player vs Player</button>
      <button onclick="setMode('ai')">🤖 Player vs AI</button>
    </div>

    <div class="board" id="board"></div>

    <div id="status" class="status">Choose a mode to start!</div>

    <div class="scoreboard">
      <p id="scoreX">Player X: 0</p>
      <p id="scoreO">Player O: 0</p>
      <p id="draws">Draws: 0</p>
    </div>

    <button onclick="restartGame()" class="restart">Restart 🔄</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
