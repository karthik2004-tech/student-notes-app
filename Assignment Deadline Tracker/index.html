<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Assignment Deadline Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <h1>📌 Assignment Deadline Tracker</h1>

    <div class="controls">
      <input type="text" id="subject" placeholder="Subject name">
      <input type="date" id="dueDate">
      <select id="priority">
        <option value="High">High</option>
        <option value="Medium">Medium</option>
        <option value="Low">Low</option>
      </select>
      <button onclick="addAssignment()">Add Assignment</button>
    </div>

    <div class="filters">
      <select id="filterSubject" onchange="applyFilters()">
        <option value="">Filter by Subject</option>
      </select>
      <select id="filterPriority" onchange="applyFilters()">
        <option value="">Filter by Priority</option>
        <option value="High">High</option>
        <option value="Medium">Medium</option>
        <option value="Low">Low</option>
      </select>
    </div>

    <div id="assignmentList" class="assignment-list"></div>

    <div class="actions">
      <button onclick="clearAll()">Clear All</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
