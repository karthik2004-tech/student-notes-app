<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Library Book Tracker | NSOC Contribution</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: white;
            font-size: 32px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0,255,255,0.5);
        }

        .subtitle {
            color: rgba(255,255,255,0.7);
            font-size: 14px;
        }

        /* Stats */
        .stats-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 12px 25px;
            text-align: center;
        }

        .stat-number {
            font-size: 28px;
            font-weight: bold;
            color: #00ffcc;
        }

        .stat-label {
            color: rgba(255,255,255,0.7);
            font-size: 11px;
        }

        /* Add Book Section */
        .add-section {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .section-title {
            color: #ffd200;
            font-size: 18px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            color: rgba(255,255,255,0.7);
            font-size: 12px;
        }

        .form-group input, .form-group select {
            padding: 10px 12px;
            border: none;
            border-radius: 12px;
            background: rgba(255,255,255,0.15);
            color: white;
            outline: none;
        }

        .add-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #00b4db, #0083b0);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        /* Search & Filter */
        .search-filter {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 30px;
            background: rgba(255,255,255,0.1);
            color: white;
            outline: none;
        }

        .filter-select {
            padding: 12px 20px;
            border: none;
            border-radius: 30px;
            background: rgba(255,255,255,0.1);
            color: white;
            cursor: pointer;
        }

        /* Books Grid */
        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        /* Book Card */
        .book-card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 18px;
            transition: 0.3s;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .book-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .book-title {
            font-size: 18px;
            font-weight: 600;
            color: white;
            flex: 1;
        }

        .book-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: bold;
        }

        .status-reading { background: #ffd200; color: #333; }
        .status-completed { background: #28a745; color: white; }
        .status-wishlist { background: #4d96ff; color: white; }

        .book-author {
            color: rgba(255,255,255,0.6);
            font-size: 12px;
            margin-bottom: 12px;
        }

        .progress-section {
            margin: 12px 0;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            color: rgba(255,255,255,0.7);
            font-size: 11px;
            margin-bottom: 5px;
        }

        .progress-bar {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            height: 6px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00b4db, #00ffcc);
            border-radius: 10px;
            transition: width 0.3s;
        }

        .book-due {
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 10px;
            margin: 12px 0;
        }

        .due-date {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .due-label { color: rgba(255,255,255,0.6); }
        .due-value { color: #ffd200; }
        .fine-amount { color: #ff6b6b; font-weight: bold; }

        .countdown {
            font-size: 11px;
            color: #00ffcc;
            margin-top: 5px;
        }

        .countdown.overdue { color: #ff6b6b; }

        .book-actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .action-btn {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 12px;
            font-size: 11px;
            cursor: pointer;
            transition: 0.2s;
        }

        .progress-btn { background: #17a2b8; color: white; }
        .edit-btn { background: #ffc107; color: #333; }
        .delete-btn { background: #dc3545; color: white; }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            color: rgba(255,255,255,0.5);
            grid-column: 1 / -1;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1a1a2e;
            border-radius: 25px;
            padding: 25px;
            max-width: 400px;
            width: 90%;
        }

        .modal-content h3 {
            color: white;
            margin-bottom: 15px;
        }

        .modal-content input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 12px;
            background: rgba(255,255,255,0.1);
            color: white;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .modal-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        .save-btn { background: #28a745; color: white; }
        .cancel-btn { background: #6c757d; color: white; }

        @media (max-width: 600px) {
            .books-grid {
                grid-template-columns: 1fr;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Digital Library Book Tracker</h1>
            <div class="subtitle">Track Reading Progress | Due Dates | Fine Calculator | Wishlist</div>
        </div>

        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-number" id="totalBooks">0</div>
                <div class="stat-label">Total Books</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="readingCount">0</div>
                <div class="stat-label">Reading</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="completedCount">0</div>
                <div class="stat-label">Completed</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="overdueCount">0</div>
                <div class="stat-label">Overdue</div>
            </div>
        </div>

        <!-- Add Book Section -->
        <div class="add-section">
            <div class="section-title">➕ Add New Book</div>
            <div class="form-grid">
                <div class="form-group">
                    <label>📖 Book Title</label>
                    <input type="text" id="bookTitle" placeholder="e.g., The Great Gatsby">
                </div>
                <div class="form-group">
                    <label>✍️ Author</label>
                    <input type="text" id="bookAuthor" placeholder="e.g., F. Scott Fitzgerald">
                </div>
                <div class="form-group">
                    <label>📌 Status</label>
                    <select id="bookStatus">
                        <option value="reading">📖 Reading</option>
                        <option value="completed">✅ Completed</option>
                        <option value="wishlist">⭐ Wishlist</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>📅 Due Date (for issued books)</label>
                    <input type="date" id="dueDate">
                </div>
            </div>
            <button class="add-btn" id="addBookBtn">✨ Add to Library</button>
        </div>

        <!-- Search & Filter -->
        <div class="search-filter">
            <input type="text" class="search-box" id="searchInput" placeholder="🔍 Search books by title or author...">
            <select class="filter-select" id="filterSelect">
                <option value="all">📋 All Books</option>
                <option value="reading">📖 Reading</option>
                <option value="completed">✅ Completed</option>
                <option value="wishlist">⭐ Wishlist</option>
            </select>
        </div>

        <!-- Books Grid -->
        <div class="books-grid" id="booksGrid">
            <!-- Dynamic books -->
        </div>
    </div>

    <!-- Progress Modal -->
    <div class="modal" id="progressModal">
        <div class="modal-content">
            <h3>📖 Update Reading Progress</h3>
            <p style="color:white;" id="progressBookTitle"></p>
            <input type="range" id="progressSlider" min="0" max="100" value="0">
            <div style="text-align:center; color:#00ffcc; margin:10px 0;"><span id="progressValue">0</span>%</div>
            <div class="modal-buttons">
                <button class="modal-btn save-btn" id="saveProgressBtn">Save</button>
                <button class="modal-btn cancel-btn" id="closeProgressBtn">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        let books = [];
        let nextId = 1;
        let currentEditBookId = null;
        const FINE_PER_DAY = 5; // ₹5 per day

        // Load from localStorage
        function loadBooks() {
            const saved = localStorage.getItem('libraryBooks');
            if(saved) {
                books = JSON.parse(saved);
                if(books.length > 0) {
                    nextId = Math.max(...books.map(b => b.id)) + 1;
                }
            } else {
                // Default books
                const today = new Date().toISOString().split('T')[0];
                const nextWeek = new Date();
                nextWeek.setDate(nextWeek.getDate() + 7);
                const nextWeekStr = nextWeek.toISOString().split('T')[0];
                const lastWeek = new Date();
                lastWeek.setDate(lastWeek.getDate() - 3);
                const lastWeekStr = lastWeek.toISOString().split('T')[0];
                
                books = [
                    { id: nextId++, title: "The Great Gatsby", author: "F. Scott Fitzgerald", status: "reading", progress: 45, dueDate: nextWeekStr },
                    { id: nextId++, title: "To Kill a Mockingbird", author: "Harper Lee", status: "completed", progress: 100, dueDate: null },
                    { id: nextId++, title: "Atomic Habits", author: "James Clear", status: "reading", progress: 30, dueDate: today },
                    { id: nextId++, title: "Rich Dad Poor Dad", author: "Robert Kiyosaki", status: "wishlist", progress: 0, dueDate: null },
                    { id: nextId++, title: "1984", author: "George Orwell", status: "reading", progress: 70, dueDate: lastWeekStr }
                ];
            }
            renderBooks();
            updateStats();
        }

        // Save to localStorage
        function saveBooks() {
            localStorage.setItem('libraryBooks', JSON.stringify(books));
        }

        // Add book
        function addBook() {
            const title = document.getElementById('bookTitle').value.trim();
            const author = document.getElementById('bookAuthor').value.trim();
            const status = document.getElementById('bookStatus').value;
            let dueDate = document.getElementById('dueDate').value;

            if(!title || !author) {
                alert('Please enter both title and author!');
                return;
            }

            if(status === 'reading' && !dueDate) {
                dueDate = null;
            }

            const newBook = {
                id: nextId++,
                title: title,
                author: author,
                status: status,
                progress: status === 'completed' ? 100 : 0,
                dueDate: status === 'reading' ? dueDate : null
            };

            books.unshift(newBook);
            saveBooks();
            renderBooks();
            updateStats();

            // Clear inputs
            document.getElementById('bookTitle').value = '';
            document.getElementById('bookAuthor').value = '';
            document.getElementById('dueDate').value = '';
        }

        // Delete book
        function deleteBook(id) {
            if(confirm('Delete this book from your library?')) {
                books = books.filter(b => b.id !== id);
                saveBooks();
                renderBooks();
                updateStats();
            }
        }

        // Update progress
        function updateProgress(id, newProgress) {
            const book = books.find(b => b.id === id);
            if(book) {
                book.progress = Math.min(100, Math.max(0, newProgress));
                if(book.progress === 100 && book.status !== 'completed') {
                    book.status = 'completed';
                }
                saveBooks();
                renderBooks();
                updateStats();
            }
        }

        // Open progress modal
        function openProgressModal(id) {
            const book = books.find(b => b.id === id);
            if(book) {
                currentEditBookId = id;
                document.getElementById('progressBookTitle').textContent = book.title;
                document.getElementById('progressSlider').value = book.progress;
                document.getElementById('progressValue').textContent = book.progress;
                document.getElementById('progressModal').classList.add('active');
            }
        }

        // Save progress from modal
        function saveProgressFromModal() {
            const newProgress = parseInt(document.getElementById('progressSlider').value);
            updateProgress(currentEditBookId, newProgress);
            document.getElementById('progressModal').classList.remove('active');
        }

        // Change status
        function changeStatus(id, newStatus) {
            const book = books.find(b => b.id === id);
            if(book) {
                book.status = newStatus;
                if(newStatus === 'completed') {
                    book.progress = 100;
                } else if(newStatus === 'wishlist') {
                    book.progress = 0;
                    book.dueDate = null;
                }
                saveBooks();
                renderBooks();
                updateStats();
            }
        }

        // Calculate fine
        function calculateFine(dueDate) {
            if(!dueDate) return 0;
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const due = new Date(dueDate);
            due.setHours(0, 0, 0, 0);
            
            if(today > due) {
                const diffDays = Math.floor((today - due) / (1000 * 60 * 60 * 24));
                return diffDays * FINE_PER_DAY;
            }
            return 0;
        }

        // Calculate countdown
        function getCountdown(dueDate) {
            if(!dueDate) return null;
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const due = new Date(dueDate);
            due.setHours(0, 0, 0, 0);
            
            const diffDays = Math.floor((due - today) / (1000 * 60 * 60 * 24));
            
            if(diffDays < 0) return `Overdue by ${Math.abs(diffDays)} days`;
            if(diffDays === 0) return "Due today!";
            if(diffDays === 1) return "Due tomorrow";
            return `${diffDays} days left`;
        }

        // Update stats
        function updateStats() {
            const total = books.length;
            const reading = books.filter(b => b.status === 'reading').length;
            const completed = books.filter(b => b.status === 'completed').length;
            const overdue = books.filter(b => {
                if(b.status !== 'reading') return false;
                const fine = calculateFine(b.dueDate);
                return fine > 0;
            }).length;
            
            document.getElementById('totalBooks').textContent = total;
            document.getElementById('readingCount').textContent = reading;
            document.getElementById('completedCount').textContent = completed;
            document.getElementById('overdueCount').textContent = overdue;
        }

        // Render books
        function renderBooks() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filterStatus = document.getElementById('filterSelect').value;
            
            let filtered = books;
            
            if(searchTerm) {
                filtered = filtered.filter(b => 
                    b.title.toLowerCase().includes(searchTerm) ||
                    b.author.toLowerCase().includes(searchTerm)
                );
            }
            
            if(filterStatus !== 'all') {
                filtered = filtered.filter(b => b.status === filterStatus);
            }
            
            const grid = document.getElementById('booksGrid');
            
            if(filtered.length === 0) {
                grid.innerHTML = '<div class="empty-state">📭 No books found!<br>Add books to start tracking your reading journey.</div>';
                return;
            }
            
            grid.innerHTML = filtered.map(book => {
                const fine = calculateFine(book.dueDate);
                const countdown = getCountdown(book.dueDate);
                const isOverdue = fine > 0;
                
                return `
                    <div class="book-card">
                        <div class="book-header">
                            <div class="book-title">${escapeHtml(book.title)}</div>
                            <div class="book-status status-${book.status}">${getStatusEmoji(book.status)} ${getStatusText(book.status)}</div>
                        </div>
                        <div class="book-author">✍️ ${escapeHtml(book.author)}</div>
                        
                        ${book.status === 'reading' || book.status === 'completed' ? `
                            <div class="progress-section">
                                <div class="progress-label">
                                    <span>📖 Reading Progress</span>
                                    <span>${book.progress}%</span>
                                </div>
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: ${book.progress}%;"></div>
                                </div>
                            </div>
                        ` : ''}
                        
                        ${book.dueDate && book.status === 'reading' ? `
                            <div class="book-due">
                                <div class="due-date">
                                    <span class="due-label">📅 Due Date:</span>
                                    <span class="due-value">${book.dueDate}</span>
                                </div>
                                <div class="due-date">
                                    <span class="due-label">💰 Fine:</span>
                                    <span class="fine-amount">${fine > 0 ? `₹${fine}` : 'No fine'}</span>
                                </div>
                                <div class="countdown ${isOverdue ? 'overdue' : ''}">⏰ ${countdown}</div>
                            </div>
                        </` : ''}
                        
                        <div class="book-actions">
                            ${book.status === 'reading' ? `<button class="action-btn progress-btn" onclick="openProgressModal(${book.id})">📖 Update Progress</button>` : ''}
                            ${book.status !== 'completed' && book.status !== 'wishlist' ? `<button class="action-btn progress-btn" onclick="changeStatus(${book.id}, 'completed')">✅ Mark Complete</button>` : ''}
                            ${book.status === 'wishlist' ? `<button class="action-btn progress-btn" onclick="changeStatus(${book.id}, 'reading')">📖 Start Reading</button>` : ''}
                            <button class="action-btn delete-btn" onclick="deleteBook(${book.id})">🗑️ Delete</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function getStatusEmoji(status) {
            if(status === 'reading') return '📖';
            if(status === 'completed') return '✅';
            return '⭐';
        }

        function getStatusText(status) {
            if(status === 'reading') return 'Reading';
            if(status === 'completed') return 'Completed';
            return 'Wishlist';
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Event listeners
        document.getElementById('addBookBtn').addEventListener('click', addBook);
        document.getElementById('searchInput').addEventListener('input', renderBooks);
        document.getElementById('filterSelect').addEventListener('change', renderBooks);
        
        // Progress slider
        const slider = document.getElementById('progressSlider');
        if(slider) {
            slider.addEventListener('input', () => {
                document.getElementById('progressValue').textContent = slider.value;
            });
        }
        
        document.getElementById('saveProgressBtn').addEventListener('click', saveProgressFromModal);
        document.getElementById('closeProgressBtn').addEventListener('click', () => {
            document.getElementById('progressModal').classList.remove('active');
        });

        // Make functions global
        window.deleteBook = deleteBook;
        window.openProgressModal = openProgressModal;
        window.changeStatus = changeStatus;

        // Initialize
        loadBooks();
    </script>
</body>
</html>
