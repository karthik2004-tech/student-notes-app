<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Generator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="card">
      <div class="hero">
        <p class="eyebrow">Instant QR Builder</p>
        <h1>QR Code Generator</h1>
        <p class="subtitle">Paste a URL or type any text, then generate a downloadable QR code image in one click.</p>
      </div>

      <div class="input-group">
        <label for="qrText">URL or text</label>
        <textarea id="qrText" rows="4" placeholder="https://example.com or any message"></textarea>
      </div>

      <div class="actions">
        <button id="generateBtn" type="button">Generate QR Code</button>
        <button id="downloadBtn" type="button" class="secondary" disabled>Download Image</button>
      </div>

      <div class="preview-panel" aria-live="polite">
        <div id="qrCode" class="qr-placeholder">
          <span>QR preview appears here</span>
        </div>
      </div>

      <p class="hint">Tip: Generate first, then download the PNG image.</p>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
