<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Periodic Table</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Interactive Periodic Table</h1>
            <p>Click on any element to learn more about it.</p>
        </header>

        <main class="periodic-table" id="periodic-table">
            <!-- Grid generated by JS -->
        </main>

        <!-- Element Info Modal -->
        <div class="modal" id="element-modal">
            <div class="modal-content">
                <span class="close-btn" id="close-modal">&times;</span>
                <div class="element-header">
                    <div class="element-symbol" id="modal-symbol">H</div>
                    <div class="element-basic-info">
                        <h2 id="modal-name">Hydrogen</h2>
                        <span class="category-badge" id="modal-category">Nonmetal</span>
                    </div>
                </div>
                <div class="element-details">
                    <div class="detail-item">
                        <strong>Atomic Number:</strong> <span id="modal-number">1</span>
                    </div>
                    <div class="detail-item">
                        <strong>Atomic Mass:</strong> <span id="modal-mass">1.008</span>
                    </div>
                    <div class="detail-item">
                        <strong>Phase at STP:</strong> <span id="modal-phase">Gas</span>
                    </div>
                    <div class="detail-item">
                        <strong>Discovered By:</strong> <span id="modal-discovered">Henry Cavendish</span>
                    </div>
                </div>
                <div class="element-summary" id="modal-summary">
                    Hydrogen is the chemical element with the symbol H and atomic number 1.
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
