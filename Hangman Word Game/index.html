<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hangman Word Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <h1>🎯 Hangman Word Game</h1>

    <div id="hangman" class="hangman">
      <svg height="250" width="200">
        <line x1="10" y1="240" x2="150" y2="240" stroke="black" stroke-width="4"/>
        <line x1="80" y1="240" x2="80" y2="20" stroke="black" stroke-width="4"/>
        <line x1="80" y1="20" x2="150" y2="20" stroke="black" stroke-width="4"/>
        <line x1="150" y1="20" x2="150" y2="50" stroke="black" stroke-width="4"/>
        <circle id="head" cx="150" cy="70" r="20" stroke="black" stroke-width="3" fill="none" style="display:none"/>
        <line id="body" x1="150" y1="90" x2="150" y2="150" stroke="black" stroke-width="3" style="display:none"/>
        <line id="leftArm" x1="150" y1="110" x2="120" y2="130" stroke="black" stroke-width="3" style="display:none"/>
        <line id="rightArm" x1="150" y1="110" x2="180" y2="130" stroke="black" stroke-width="3" style="display:none"/>
        <line id="leftLeg" x1="150" y1="150" x2="120" y2="180" stroke="black" stroke-width="3" style="display:none"/>
        <line id="rightLeg" x1="150" y1="150" x2="180" y2="180" stroke="black" stroke-width="3" style="display:none"/>
      </svg>
    </div>

    <div id="wordDisplay" class="word-display"></div>
    <div id="keyboard" class="keyboard"></div>

    <div class="controls">
      <button onclick="newGame()">New Game</button>
      <button onclick="showHint()">Hint</button>
    </div>

    <div id="status" class="status"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
