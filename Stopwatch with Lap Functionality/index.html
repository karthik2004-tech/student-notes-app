<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stopwatch with Lap Functionality</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <h1>⏱️ Stopwatch with Lap Functionality</h1>

    <div id="display" class="display">00:00.00</div>

    <div class="controls">
      <button onclick="startStop()">Start</button>
      <button onclick="reset()">Reset</button>
      <button onclick="lap()">Lap</button>
      <button onclick="exportLaps()">Export Laps</button>
    </div>

    <div class="laps">
      <h2>Lap History</h2>
      <ul id="lapList"></ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
