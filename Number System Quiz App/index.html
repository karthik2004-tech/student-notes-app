<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Number System Quiz App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="quiz-container">
    <h1>🔢 Number System Quiz</h1>
    <div id="question">Click Start to begin!</div>
    <div id="options"></div>
    <input id="typedAnswer" type="text" placeholder="Type your answer..." class="hidden">
    <div class="controls">
      <button id="startBtn">Start Quiz</button>
      <button id="submitBtn" class="hidden">Submit</button>
    </div>
    <div id="feedback"></div>
    <div id="scoreBoard">Score: 0</div>
  </div>
  <script src="script.js"></script>
</body>
</html>
