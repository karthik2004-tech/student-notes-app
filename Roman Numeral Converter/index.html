<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Roman Numeral Converter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <h1>🔢 Roman Numeral Converter</h1>

    <div class="converter">
      <div class="card">
        <h2>Arabic → Roman</h2>
        <input type="number" id="arabicInput" placeholder="Enter number (1–3999)">
        <p id="romanOutput">Roman: —</p>
      </div>

      <div class="card">
        <h2>Roman → Arabic</h2>
        <input type="text" id="romanInput" placeholder="Enter Roman numeral">
        <p id="arabicOutput">Arabic: —</p>
      </div>
    </div>

    <p id="status"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
