<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Focus Music Player (Lo-Fi Beats)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <h1>🎶 Focus Music Player (Lo-Fi Beats)</h1>

    <div class="player-controls">
      <button onclick="prevTrack()">⏮️ Prev</button>
      <button onclick="togglePlay()">▶️ Play/Pause</button>
      <button onclick="nextTrack()">⏭️ Next</button>
      <input type="range" id="volume" min="0" max="1" step="0.01" onchange="setVolume(this.value)">
    </div>

    <div id="trackInfo" class="track-info">Track: --</div>

    <div class="timer-controls">
      <label>Study Timer (minutes): <input type="number" id="timerInput" value="25"></label>
      <button onclick="startTimer()">Start Timer</button>
      <button onclick="resetTimer()">Reset Timer</button>
    </div>

    <div id="timerDisplay" class="timer-display">Timer: --</div>
  </div>

  <audio id="audioPlayer" loop></audio>

  <script src="script.js"></script>
</body>
</html>
