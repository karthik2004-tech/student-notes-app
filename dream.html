<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Career Planner — Visualize Your Future</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #fdfcfd;
            --glass: rgba(255, 255, 255, 0.7);
            --accent: #a78bfa; /* Soft Purple */
            --accent-light: #c4b5fd;
            --text: #1e293b;
            --text-dim: #64748b;
            --dream-gradient: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            --card-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05);
        }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--dream-gradient);
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 24px;
        }

        @media (max-width: 850px) {
            .container { grid-template-columns: 1fr; }
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 32px;
            padding: 32px;
            box-shadow: var(--card-shadow);
            margin-bottom: 24px;
        }

        header {
            text-align: center;
            margin-bottom: 32px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(to right, #4f46e5, #9333ea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .subtitle { font-size: 1rem; color: var(--text-dim); margin-top: 8px; }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Input Group */
        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        input {
            flex: 1;
            background: white;
            border: 1px solid rgba(0,0,0,0.05);
            border-radius: 16px;
            padding: 14px 20px;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(167, 139, 250, 0.1); }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0 24px;
            border-radius: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            white-space: nowrap;
        }

        .btn:hover { background: #8b5cf6; transform: translateY(-2px); }

        /* List Items */
        .item-list { display: flex; flex-direction: column; gap: 12px; }

        .list-item {
            background: white;
            padding: 16px 20px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: 0.3s;
            border: 1px solid rgba(0,0,0,0.02);
        }

        .list-item:hover { transform: scale(1.02); box-shadow: 0 4px 20px rgba(0,0,0,0.03); }

        .item-info { display: flex; align-items: center; gap: 12px; }

        .checkbox {
            width: 22px;
            height: 22px;
            border-radius: 6px;
            border: 2px solid var(--accent);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .checkbox.checked { background: var(--accent); }
        .checkbox.checked::after { content: '✓'; color: white; font-size: 14px; font-weight: 800; }

        .list-item.completed .item-text { text-decoration: line-through; color: var(--text-dim); }

        /* Sidebar Stats */
        .stat-card {
            text-align: center;
            margin-bottom: 20px;
        }

        .progress-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: conic-gradient(var(--accent) var(--p, 0%), #eee 0);
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .progress-circle::after {
            content: attr(data-val);
            width: 100px;
            height: 100px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.4rem;
        }

        .achievement-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .badge {
            aspect-ratio: 1;
            background: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            opacity: 0.3;
            filter: grayscale(1);
            transition: 0.5s;
        }

        .badge.unlocked { opacity: 1; filter: grayscale(0); transform: scale(1.1); box-shadow: 0 4px 15px rgba(167, 139, 250, 0.2); }
    </style>
</head>
<body>

    <div class="container">
        <div class="main-col">
            <div class="glass-card">
                <header>
                    <h1>My Dream Career</h1>
                    <div class="subtitle" id="career-goal-display">Define your destiny...</div>
                </header>

                <div class="input-group">
                    <input type="text" id="goal-input" placeholder="What is your dream career?">
                    <button class="btn" onclick="setGoal()">Set Goal 🌟</button>
                </div>
            </div>

            <div class="glass-card">
                <div class="section-title">🛠️ Required Skills</div>
                <div class="input-group">
                    <input type="text" id="skill-input" placeholder="Add a required skill...">
                    <button class="btn" onclick="addItem('skills')">Add</button>
                </div>
                <div class="item-list" id="skills-list"></div>
            </div>

            <div class="glass-card">
                <div class="section-title">🏔️ Major Milestones</div>
                <div class="input-group">
                    <input type="text" id="milestone-input" placeholder="Add a career milestone...">
                    <button class="btn" onclick="addItem('milestones')">Add</button>
                </div>
                <div class="item-list" id="milestones-list"></div>
            </div>
        </div>

        <aside class="sidebar">
            <div class="glass-card stat-card">
                <div class="section-title" style="justify-content: center;">Overall Progress</div>
                <div class="progress-circle" id="overall-progress" data-val="0%"></div>
                <p style="font-size: 0.85rem; color: var(--text-dim);">Manifesting your dream, step by step.</p>
            </div>

            <div class="glass-card">
                <div class="section-title">🏆 Achievements</div>
                <div class="achievement-grid">
                    <div class="badge" title="Visionary: Set a career goal" id="ach-goal">🎯</div>
                    <div class="badge" title="Skilled: Add 5 skills" id="ach-skills">🧠</div>
                    <div class="badge" title="Climber: Complete first milestone" id="ach-climb">🧗</div>
                    <div class="badge" title="Master: Complete all skills" id="ach-master">👑</div>
                    <div class="badge" title="Reality: Reach 100% progress" id="ach-reality">🌍</div>
                    <div class="badge" title="Consistent: Maintain the dream" id="ach-dream">🦄</div>
                </div>
            </div>
        </aside>
    </div>

    <script>
        let state = JSON.parse(localStorage.getItem('dream_career')) || {
            goal: "",
            skills: [],
            milestones: []
        };

        function save() {
            localStorage.setItem('dream_career', JSON.stringify(state));
            render();
        }

        function setGoal() {
            const input = document.getElementById('goal-input');
            if (!input.value) return;
            state.goal = input.value;
            input.value = '';
            save();
        }

        function addItem(type) {
            const input = document.getElementById(`${type.slice(0, -1)}-input`);
            if (!input.value) return;
            state[type].push({ id: Date.now(), text: input.value, completed: false });
            input.value = '';
            save();
        }

        function toggleItem(type, id) {
            const item = state[type].find(i => i.id === id);
            if (item) item.completed = !item.completed;
            save();
        }

        function render() {
            document.getElementById('career-goal-display').innerText = state.goal || "Define your destiny...";
            
            ['skills', 'milestones'].forEach(type => {
                const list = document.getElementById(`${type}-list`);
                list.innerHTML = '';
                state[type].forEach(item => {
                    const el = document.createElement('div');
                    el.className = `list-item ${item.completed ? 'completed' : ''}`;
                    el.innerHTML = `
                        <div class="item-info">
                            <div class="checkbox ${item.completed ? 'checked' : ''}" onclick="toggleItem('${type}', ${item.id})"></div>
                            <span class="item-text">${item.text}</span>
                        </div>
                    `;
                    list.appendChild(el);
                });
            });

            // Progress calculation
            const total = state.skills.length + state.milestones.length;
            const completed = state.skills.filter(s => s.completed).length + state.milestones.filter(m => m.completed).length;
            const percent = total === 0 ? 0 : Math.round((completed / total) * 100);
            
            const circle = document.getElementById('overall-progress');
            circle.style.setProperty('--p', `${percent}%`);
            circle.setAttribute('data-val', `${percent}%`);

            // Achievements
            document.getElementById('ach-goal').classList.toggle('unlocked', !!state.goal);
            document.getElementById('ach-skills').classList.toggle('unlocked', state.skills.length >= 5);
            document.getElementById('ach-climb').classList.toggle('unlocked', state.milestones.some(m => m.completed));
            document.getElementById('ach-master').classList.toggle('unlocked', state.skills.length > 0 && state.skills.every(s => s.completed));
            document.getElementById('ach-reality').classList.toggle('unlocked', percent === 100 && total > 0);
            document.getElementById('ach-dream').classList.toggle('unlocked', total >= 10);
        }

        render();
    </script>
</body>
</html>
