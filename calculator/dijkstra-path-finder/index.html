<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dijkstra Path Finder</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

    <div class="app-container">
        <!-- Header Controls -->
        <header class="header">
            <div class="brand">
                <i class="ph-fill ph-map-pin-line"></i>
                <h1>PathFinder UI</h1>
            </div>
            
            <div class="controls">
                <button class="btn btn-outline" id="clear-board-btn">Clear Board</button>
                <button class="btn btn-outline" id="clear-path-btn">Clear Path</button>
                
                <div class="speed-control">
                    <label for="speed-select">Speed:</label>
                    <select id="speed-select">
                        <option value="fast">Fast</option>
                        <option value="average" selected>Average</option>
                        <option value="slow">Slow</option>
                    </select>
                </div>

                <button class="btn btn-primary" id="start-btn">Visualize Dijkstra</button>
            </div>
        </header>

        <!-- Legend -->
        <div class="legend">
            <div class="legend-item"><div class="node-demo node-start"></div> Start Node</div>
            <div class="legend-item"><div class="node-demo node-target"></div> Target Node</div>
            <div class="legend-item"><div class="node-demo node-wall"></div> Wall Node</div>
            <div class="legend-item"><div class="node-demo node-visited"></div> Visited Node</div>
            <div class="legend-item"><div class="node-demo node-path"></div> Shortest Path</div>
        </div>
        
        <div class="instructions">
            <p><i class="ph ph-info"></i> Click and drag to draw walls. Drag the Start or Target nodes to move them.</p>
        </div>

        <!-- Grid Container -->
        <main class="grid-container" id="grid-container">
            <!-- Grid will be generated by JS -->
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
