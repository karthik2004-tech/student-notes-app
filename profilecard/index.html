<!DOCTYPE html>
<html lang="en">
<head>

  <title>Advanced Profile Card</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="card" id="card">

  <h2>Syed Ateefa</h2>

  <div class="stats">
    <div>
      <h3>120</h3>
      <span>Posts</span>

    <div>
      <h3>5.2K</h3>
      <span>Followers</span>
    </div>
    <div>
      <h3>320</h3>
      <span>Following</span>
    </div>
  </div>

  <button id="themeBtn">Change Theme</button>
</div>

<script src="app.js"></script>
</body>
</html>
